apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: student-performance

spec:
  replicas: 1

  selector:
    matchLabels:
      app: student-performance

  template:
    metadata:
      labels:
        app: student-performance

    spec:
      containers:
        - name: student-performance
          image: xenolinhhv/student-performance-prediction:b4931dacf3e38499bbc76b0f5563aba27c654925
          ports:
            - containerPort: 8000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: student-performance-secret
                  key: SECRET_KEY

  strategy:
    canary:
      stableService: student-performance-service
      canaryService: student-performance-canary

      steps:
        - setWeight: 20

        - analysis:
            templates:
              - templateName: student-performance-health-check

        - setWeight: 50

        - analysis:
            templates:
              - templateName: student-performance-health-check

        - setWeight: 100